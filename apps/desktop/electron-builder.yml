appId: com.privanote.desktop
productName: Privanote
directories:
  output: release
extraResources:
  - from: ../backend/dist
    to: backend
asarUnpack:
  - node_modules/better-sqlite3/**/*
mac:
  icon: resources/icon.icns
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - dir
  extendInfo:
    NSMicrophoneUsageDescription: Privanote records audio locally so you can capture notes without sending media to the cloud.
    NSCameraUsageDescription: Privanote records video locally so you can capture media-backed notes on your device.
