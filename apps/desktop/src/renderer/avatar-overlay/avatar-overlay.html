<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nota Avatar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 300px;
      height: 220px;
      background: transparent;
      overflow: hidden;
    }

    body {
      -webkit-app-region: no-drag;
      user-select: none;
    }

    .container {
      position: relative;
      width: 300px;
      height: 220px;
      -webkit-app-region: drag;
    }

    .bubble {
      display: none;
      position: absolute;
      bottom: 80px;      /* centered on torso */
      left: 92px;
      max-width: 196px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 8px 14px;
      font: 12px/1.5 system-ui, sans-serif;
      white-space: normal;
      word-break: break-word;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.14);
      color: #1e293b;
      z-index: 10;
    }

    .avatar-btn {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 80px;
      height: 140px;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      outline: none;
      -webkit-app-region: no-drag;
    }

    .avatar-btn svg {
      width: 80px;
      height: 140px;
      display: block;
    }

    @keyframes bounce {
      0%   { transform: translateY(0); }
      30%  { transform: translateY(-10px); }
      60%  { transform: translateY(0); }
      80%  { transform: translateY(-5px); }
      100% { transform: translateY(0); }
    }

    .avatar-btn.bouncing { animation: bounce 600ms ease; }
  </style>
</head>
<body>
  <div class="container">
    <div class="bubble" id="bubble"></div>

    <button class="avatar-btn" id="avatarBtn" type="button" aria-label="Avatar de Privanote">
      <svg viewBox="0 0 80 140" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="g-head" cx="50%" cy="38%" r="65%">
            <stop offset="0%"   stop-color="#ffffff" />
            <stop offset="60%"  stop-color="#f1f1f1" />
            <stop offset="100%" stop-color="#d8d8d8" />
          </radialGradient>
          <radialGradient id="g-body" cx="50%" cy="30%" r="70%">
            <stop offset="0%"   stop-color="#f7f7f7" />
            <stop offset="70%"  stop-color="#e8e8e8" />
            <stop offset="100%" stop-color="#d0d0d0" />
          </radialGradient>
          <radialGradient id="g-cheek" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="oklch(0.82 0.14 25 / 0.75)" />
            <stop offset="100%" stop-color="oklch(0.82 0.14 25 / 0)" />
          </radialGradient>
        </defs>

        <!-- Legs -->
        <rect x="22" y="95" width="14" height="38" rx="7"
          fill="url(#g-body)" stroke="#c4c4c4" stroke-width="1"/>
        <rect x="44" y="95" width="14" height="38" rx="7"
          fill="url(#g-body)" stroke="#c4c4c4" stroke-width="1"/>

        <!-- Arms -->
        <rect x="4"  y="50" width="15" height="38" rx="7.5"
          fill="url(#g-body)" stroke="#c4c4c4" stroke-width="1"/>
        <rect x="61" y="50" width="15" height="38" rx="7.5"
          fill="url(#g-body)" stroke="#c4c4c4" stroke-width="1"/>

        <!-- Torso -->
        <rect x="16" y="40" width="48" height="62" rx="18"
          fill="url(#g-body)" stroke="#c4c4c4" stroke-width="1"/>

        <!-- Head -->
        <circle cx="40" cy="22" r="20"
          fill="url(#g-head)" stroke="#c4c4c4" stroke-width="1"/>

        <!-- Head highlight -->
        <ellipse cx="32" cy="13" rx="7" ry="4" fill="white" opacity="0.6"/>

        <!-- Cheeks -->
        <circle cx="25" cy="26" r="4.5" fill="url(#g-cheek)"/>
        <circle cx="55" cy="26" r="4.5" fill="url(#g-cheek)"/>

        <!-- Eyes -->
        <ellipse id="eye-left"    cx="33" cy="20" rx="2.6" ry="3.2" fill="#1e293b"/>
        <ellipse id="eye-right"   cx="47" cy="20" rx="2.6" ry="3.2" fill="#1e293b"/>
        <circle  id="shine-left"  cx="34" cy="19" r="0.9"  fill="white"/>
        <circle  id="shine-right" cx="48" cy="19" r="0.9"  fill="white"/>

        <!-- Mouth -->
        <path id="mouth-closed"
          d="M34 31 Q40 36 46 31"
          stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path id="mouth-open"
          d="M33 30 Q40 39 47 30 Q40 35 33 30 Z"
          fill="#1e293b" opacity="0.8" style="display:none;"/>

        <!-- Shirt detail: small collar line -->
        <path d="M34 41 Q40 46 46 41"
          stroke="#b0b0b0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.5"/>
      </svg>
    </button>
  </div>

  <script>
    'use strict';

    const greetings = [
      { text: '¡Hola! Soy Nota, tu asistente favorita.', pitch: 1.45, rate: 1.1 },
      { text: '¡Vamos a grabar algo increíble hoy!',     pitch: 1.5,  rate: 1.15 },
      { text: 'Tus notas están súper seguras conmigo.',   pitch: 1.3,  rate: 1.05 },
      { text: '¡Local first... siempre contigo!',         pitch: 1.4,  rate: 1.1 },
      { text: '¡Aquí estoy! ¿Qué capturamos hoy?',       pitch: 1.5,  rate: 1.1 },
      { text: '¡No olvides nada, para eso existo yo!',   pitch: 1.45, rate: 1.15 },
    ];

    const btn         = document.getElementById('avatarBtn');
    const bubble      = document.getElementById('bubble');
    const eyeLeft     = document.getElementById('eye-left');
    const eyeRight    = document.getElementById('eye-right');
    const shineLeft   = document.getElementById('shine-left');
    const shineRight  = document.getElementById('shine-right');
    const mouthClosed = document.getElementById('mouth-closed');
    const mouthOpen   = document.getElementById('mouth-open');

    let bubbleTimer  = null;
    let talkInterval = null;

    // --- Blinking ---
    function scheduleBlink() {
      const delay = 2000 + Math.random() * 3000;
      setTimeout(() => {
        eyeLeft.setAttribute('ry', '0.3');
        eyeRight.setAttribute('ry', '0.3');
        shineLeft.style.display = 'none';
        shineRight.style.display = 'none';
        setTimeout(() => {
          eyeLeft.setAttribute('ry', '3.2');
          eyeRight.setAttribute('ry', '3.2');
          shineLeft.style.display = '';
          shineRight.style.display = '';
          scheduleBlink();
        }, 160);
      }, delay);
    }
    scheduleBlink();

    // --- Talking mouth animation (variable speed = more natural) ---
    function startTalking() {
      let open = false;
      function tick() {
        open = !open;
        mouthClosed.style.display = open ? 'none' : '';
        mouthOpen.style.display   = open ? ''     : 'none';
        talkInterval = setTimeout(tick, 100 + Math.random() * 120);
      }
      talkInterval = setTimeout(tick, 80);
    }

    function stopTalking() {
      if (talkInterval) { clearTimeout(talkInterval); talkInterval = null; }
      mouthClosed.style.display = '';
      mouthOpen.style.display   = 'none';
    }

    // --- Voice selection: prefer neural/enhanced macOS voices ---
    function getBestVoice() {
      const voices = window.speechSynthesis.getVoices();
      // Priority: named neural macOS voices → any Enhanced → any Spanish
      const priority = ['Paulina', 'Mónica', 'Monica', 'Juan', 'Jorge'];
      for (const name of priority) {
        const v = voices.find(v => v.name === name);
        if (v) return v;
      }
      const enhanced = voices.find(v => v.lang.startsWith('es') && v.name.includes('Enhanced'));
      if (enhanced) return enhanced;
      return voices.find(v => v.lang.startsWith('es')) || null;
    }

    // --- Voice (Web Speech API) ---
    function speak(greeting) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();

      const utter    = new SpeechSynthesisUtterance(greeting.text);
      utter.lang     = 'es-MX';
      utter.pitch    = greeting.pitch + (Math.random() * 0.08 - 0.04); // tiny natural variation
      utter.rate     = greeting.rate  + (Math.random() * 0.06 - 0.03);
      utter.volume   = 1.0;

      const voice = getBestVoice();
      if (voice) utter.voice = voice;

      utter.onstart = () => startTalking();
      utter.onend   = () => {
        stopTalking();
        if (bubbleTimer) clearTimeout(bubbleTimer);
        bubbleTimer = setTimeout(() => { bubble.style.display = 'none'; }, 500);
      };
      utter.onerror = () => stopTalking();

      window.speechSynthesis.speak(utter);
    }

    // --- Hover mouth ---
    btn.addEventListener('mouseover', () => {
      if (!talkInterval) { mouthClosed.style.display = 'none'; mouthOpen.style.display = ''; }
    });
    btn.addEventListener('mouseleave', () => {
      if (!talkInterval) { mouthClosed.style.display = ''; mouthOpen.style.display = 'none'; }
    });

    // --- Click: bounce + bubble + voice ---
    btn.addEventListener('click', () => {
      // Bounce
      btn.classList.remove('bouncing');
      void btn.offsetWidth;
      btn.classList.add('bouncing');
      btn.addEventListener('animationend', () => btn.classList.remove('bouncing'), { once: true });

      // Show bubble
      const greeting = greetings[Math.floor(Math.random() * greetings.length)];
      bubble.textContent = greeting.text;
      bubble.style.display = 'block';
      if (bubbleTimer) clearTimeout(bubbleTimer);

      // Speak — voices may need a tick to load on first call
      if (window.speechSynthesis.getVoices().length === 0) {
        window.speechSynthesis.addEventListener('voiceschanged', () => speak(greeting), { once: true });
      } else {
        speak(greeting);
      }
    });
  </script>
</body>
</html>
