<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privanote Capture</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      width: 64px;
      height: 72px;
      transition: height 200ms ease-out;
    }
    .container {
      width: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      -webkit-app-region: drag;
      transition: height 200ms ease-out;
    }
    .btn {
      -webkit-app-region: no-drag;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 150ms ease, transform 150ms ease;
      position: relative;
      z-index: 1;
      background: oklch(0.214 0.009 43.1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.24);
    }
    .btn:hover { background: oklch(0.35 0.012 43.1); transform: scale(1.06); }
    .btn.recording { background: oklch(0.577 0.245 27.325); box-shadow: 0 2px 12px rgba(220,50,50,0.35); }
    .btn.finalizing { background: oklch(0.547 0.021 43.1); cursor: default; }
    .btn svg {
      width: 24px; height: 24px;
      fill: none;
      stroke: oklch(0.986 0.002 67.8);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .btn.recording svg { width: 20px; height: 20px; stroke: white; }
    .btn.finalizing svg { stroke: white; }
    .pulse {
      animation: pulse 1.5s ease-out infinite;
      background: oklch(0.577 0.245 27.325);
      border-radius: 50%;
      position: absolute;
      inset: -4px;
      pointer-events: none;
      z-index: 0;
      display: none;
    }
    .recording .pulse { display: block; }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.4; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; }
    .btn.monitoring { background: oklch(0.488 0.243 264.376); box-shadow: 0 2px 12px rgba(50,80,220,0.35); }
    .btn.monitoring svg { width: 20px; height: 20px; stroke: white; }
    .btn.clip-finalizing { background: oklch(0.547 0.021 43.1); cursor: default; }
    .btn.clip-finalizing svg { stroke: white; }
    .clipboard-pulse {
      animation: clipboard-pulse 1.5s ease-out infinite;
      background: oklch(0.488 0.243 264.376);
      border-radius: 50%;
      position: absolute;
      inset: -4px;
      pointer-events: none;
      z-index: 0;
      display: none;
    }
    .monitoring .clipboard-pulse { display: block; }
    @keyframes clipboard-pulse {
      0% { transform: scale(1); opacity: 0.4; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: oklch(0.488 0.243 264.376);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 11px;
      font-weight: 600;
      line-height: 20px;
      text-align: center;
      display: none;
      z-index: 2;
      pointer-events: none;
    }

    /* Call recording button states */
    .btn.call-recording { background: oklch(0.55 0.20 145); box-shadow: 0 2px 12px rgba(50,180,50,0.35); }
    .btn.call-recording svg { width: 20px; height: 20px; stroke: white; }
    .btn.call-amber { background: oklch(0.75 0.18 85); box-shadow: 0 2px 12px rgba(200,160,50,0.35); }
    .btn.call-amber svg { width: 20px; height: 20px; stroke: white; }
    .btn.call-finalizing { background: oklch(0.547 0.021 43.1); cursor: default; }
    .btn.call-finalizing svg { stroke: white; }

    .call-pulse {
      animation: call-pulse 1.5s ease-out infinite;
      background: oklch(0.55 0.20 145);
      border-radius: 50%;
      position: absolute;
      inset: -4px;
      pointer-events: none;
      z-index: 0;
      display: none;
    }
    .call-recording .call-pulse { display: block; }
    .call-amber .call-pulse { display: block; background: oklch(0.75 0.18 85); }
    @keyframes call-pulse {
      0% { transform: scale(1); opacity: 0.4; }
      100% { transform: scale(1.3); opacity: 0; }
    }

    /* Mutual exclusion disabled state */
    .btn.disabled { opacity: 0.35; pointer-events: none; cursor: default; }

    /* Conditional visibility for screen capture and call buttons */
    #btn { display: none; }
    #btn.visible { display: flex; }
    #callBtn { display: none; }
    #callBtn.visible { display: flex; }
  </style>
</head>
<body>
  <div class="container">
    <button class="btn" id="clipBtn" title="Start clipboard monitoring" aria-label="Start clipboard monitoring">
      <div class="clipboard-pulse"></div>
      <span class="badge" id="badge" aria-live="polite"></span>
      <svg id="clipIcon" viewBox="0 0 24 24">
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
      </svg>
    </button>
    <button class="btn" id="btn" title="Start screen capture" aria-label="Start screen capture">
      <div class="pulse"></div>
      <svg id="icon" viewBox="0 0 24 24">
        <!-- eye icon (idle) -->
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
    <button class="btn" id="callBtn" title="Record call" aria-label="Record call">
      <div class="call-pulse"></div>
      <svg id="callIcon" viewBox="0 0 24 24">
        <!-- headphones icon (idle) -->
        <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
      </svg>
    </button>
  </div>

  <script>
    const btn = document.getElementById('btn');
    const icon = document.getElementById('icon');
    const container = document.querySelector('.container');

    // Track which buttons are visible to compute dynamic height
    let captureVisible = false;
    let callVisible = false;

    // Mutual exclusion state tracking
    let screenCaptureActive = false;
    let callRecActive = false;

    function recalcHeight() {
      // clipboard always visible = 1, plus conditional buttons
      let count = 1;
      if (captureVisible) count++;
      if (callVisible) count++;
      const height = count * 64 + 8; // 56px button + 8px gap per button, plus 8px padding
      document.body.style.height = height + 'px';
      container.style.height = height + 'px';
      // Notify main process to resize the window
      if (window.captureApi && window.captureApi.resizeOverlay) {
        window.captureApi.resizeOverlay(64, height);
      }
    }

    function updateMutualExclusion() {
      // Disable screen capture button when call recording is active
      if (callRecActive && !screenCaptureActive) {
        btn.classList.add('disabled');
      } else {
        btn.classList.remove('disabled');
      }
      // Disable call button when screen capture is active
      if (screenCaptureActive && !callRecActive && callBtn.classList.contains('visible')) {
        callBtn.classList.add('disabled');
      } else {
        callBtn.classList.remove('disabled');
      }
    }

    // --- Screen capture button ---
    const ICONS = {
      idle: `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`,
      recording: `<rect x="6" y="6" width="12" height="12" rx="1" fill="white" stroke="none"/>`,
      finalizing: `<path class="spinner" d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>`,
    };

    const TITLES = {
      idle: 'Start screen capture',
      recording: 'Stop screen capture',
      finalizing: 'Creating note...',
    };

    function setState(raw) {
      // CaptureSession emits 'capturing', overlay uses 'recording'
      const state = raw === 'capturing' ? 'recording' : raw;
      // Preserve 'visible' class
      const vis = btn.classList.contains('visible') ? ' visible' : '';
      btn.className = 'btn' + (state !== 'idle' ? ' ' + state : '') + vis;
      icon.innerHTML = ICONS[state] || ICONS.idle;
      btn.title = TITLES[state] || TITLES.idle;
      btn.setAttribute('aria-label', btn.title);
      screenCaptureActive = (state === 'recording' || state === 'finalizing');
      updateMutualExclusion();
    }

    function showCaptureButton() {
      if (!captureVisible) {
        captureVisible = true;
        btn.classList.add('visible');
        recalcHeight();
      }
    }

    function hideCaptureButton() {
      // Don't hide if actively capturing
      if (screenCaptureActive) return;
      if (captureVisible) {
        captureVisible = false;
        btn.classList.remove('visible');
        recalcHeight();
      }
    }

    // Listen for state changes from main process
    if (window.captureApi) {
      window.captureApi.getSessionState().then(s => { if (s) setState(s); });
      window.captureApi.onStateChange(setState);
    }

    btn.addEventListener('click', async () => {
      if (!window.captureApi) {
        console.warn('[capture-overlay] captureApi not available');
        return;
      }
      if (btn.classList.contains('finalizing')) return;

      if (btn.classList.contains('recording')) {
        await window.captureApi.stopSession();
      } else {
        await window.captureApi.startSession();
      }
    });

    // --- Clipboard button (always visible) ---
    const clipBtn = document.getElementById('clipBtn');
    const clipIcon = document.getElementById('clipIcon');
    const badge = document.getElementById('badge');

    const CLIP_ICONS = {
      idle: `<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>`,
      monitoring: `<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M9 14l2 2 4-4"/>`,
      finalizing: `<path class="spinner" d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>`,
    };

    const CLIP_TITLES = {
      idle: 'Start clipboard monitoring',
      monitoring: 'Stop clipboard monitoring',
      finalizing: 'Creating note...',
    };

    function setClipState(state) {
      const cssClass = state === 'monitoring' ? 'monitoring' : (state === 'finalizing' ? 'clip-finalizing' : '');
      clipBtn.className = 'btn' + (cssClass ? ' ' + cssClass : '');
      clipIcon.innerHTML = CLIP_ICONS[state] || CLIP_ICONS.idle;
      clipBtn.title = CLIP_TITLES[state] || CLIP_TITLES.idle;
      clipBtn.setAttribute('aria-label', clipBtn.title);
      if (state === 'idle') {
        badge.style.display = 'none';
        badge.textContent = '';
      }
    }

    function updateBadge(count) {
      if (count > 0) {
        badge.style.display = 'block';
        badge.textContent = count > 99 ? '99+' : String(count);
      } else {
        badge.style.display = 'none';
        badge.textContent = '';
      }
    }

    if (window.captureApi) {
      window.captureApi.getClipboardState().then(s => { if (s) setClipState(s); });
      window.captureApi.onClipboardStateChange(setClipState);
      window.captureApi.onClipboardCount(updateBadge);
    }

    clipBtn.addEventListener('click', async () => {
      if (!window.captureApi) {
        console.warn('[capture-overlay] captureApi not available');
        return;
      }
      if (clipBtn.classList.contains('clip-finalizing')) return;

      if (clipBtn.classList.contains('monitoring')) {
        await window.captureApi.stopClipboard();
      } else {
        await window.captureApi.startClipboard();
      }
    });

    // --- Call recording button ---
    const callBtn = document.getElementById('callBtn');
    const callIcon = document.getElementById('callIcon');
    let callMediaActive = false;
    let callRecState = 'idle'; // idle, recording, amber, finalizing

    const CALL_ICONS = {
      idle: `<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>`,
      recording: `<rect x="6" y="6" width="12" height="12" rx="1" fill="white" stroke="none"/>`,
      finalizing: `<path class="spinner" d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>`,
    };

    function setCallState(state, appName) {
      callRecState = state;
      callRecActive = (state === 'recording' || state === 'amber' || state === 'finalizing');
      const label = appName || 'call';
      // Preserve 'visible' class
      const vis = callBtn.classList.contains('visible') ? ' visible' : '';
      if (state === 'idle') {
        callBtn.className = 'btn' + vis;
        callIcon.innerHTML = CALL_ICONS.idle;
        callBtn.title = `Record ${label}`;
        callBtn.setAttribute('aria-label', `Record ${label}`);
      } else if (state === 'recording') {
        callBtn.className = 'btn call-recording' + vis;
        callIcon.innerHTML = CALL_ICONS.recording;
        callBtn.title = `Stop ${label} recording`;
        callBtn.setAttribute('aria-label', `Stop ${label} recording`);
      } else if (state === 'amber') {
        callBtn.className = 'btn call-amber' + vis;
        callIcon.innerHTML = CALL_ICONS.recording;
        callBtn.title = 'Stop recording (call ended)';
        callBtn.setAttribute('aria-label', 'Stop recording (call ended)');
      } else if (state === 'finalizing') {
        callBtn.className = 'btn call-finalizing' + vis;
        callIcon.innerHTML = CALL_ICONS.finalizing;
        callBtn.title = 'Creating note...';
        callBtn.setAttribute('aria-label', 'Creating note...');
      }
      updateMutualExclusion();
    }

    let currentAppName = '';

    function showCallButton(appName) {
      callMediaActive = true;
      currentAppName = appName || 'Unknown';
      const displayName = currentAppName + ' call';
      if (!callVisible) {
        callVisible = true;
        callBtn.classList.add('visible');
        recalcHeight();
      }
      if (callRecState === 'idle') {
        setCallState('idle', displayName);
      }
    }

    function hideCallButton() {
      callMediaActive = false;
      if (callRecState === 'idle') {
        callVisible = false;
        callBtn.classList.remove('visible');
        callBtn.className = 'btn';
        recalcHeight();
      }
      // If recording, button stays visible (amber state handled by onCallEnded)
    }

    function removeCallButton() {
      callVisible = false;
      callBtn.classList.remove('visible');
      callBtn.className = 'btn';
      callRecState = 'idle';
      recalcHeight();
    }

    if (window.captureApi) {
      // Check initial state on load
      window.captureApi.getMediaState().then(state => {
        if (state && state.active) {
          showCallButton(state.appName);
          if (state.callRecordingActive) {
            setCallState('recording', (state.appName || 'Unknown') + ' call');
          }
        }
      });

      window.captureApi.onMediaDetected((data) => {
        showCallButton(data.appName);
      });

      window.captureApi.onMediaEnded(() => {
        hideCallButton();
      });

      window.captureApi.onCallEnded(() => {
        // Call ended while recording — transition to amber per D-07
        if (callRecState === 'recording') {
          setCallState('amber');
        } else {
          hideCallButton();
        }
      });

      window.captureApi.onCallRecordingState((state) => {
        if (state === 'recording') {
          setCallState('recording', currentAppName + ' call');
        } else if (state === 'finalizing') {
          setCallState('finalizing');
        } else if (state === 'idle') {
          // Recording finished
          if (!callMediaActive) {
            removeCallButton();
          } else {
            setCallState('idle', currentAppName + ' call');
          }
        }
      });

      // Listen for whitelist state changes from main process
      window.captureApi.onWhitelistState((whitelisted) => {
        if (whitelisted) {
          showCaptureButton();
        } else {
          hideCaptureButton();
        }
      });
    }

    callBtn.addEventListener('click', async () => {
      if (!window.captureApi) return;
      if (callRecState === 'finalizing') return;

      if (callRecState === 'recording' || callRecState === 'amber') {
        await window.captureApi.stopCallRecording();
      } else {
        await window.captureApi.startCallRecording();
      }
    });

    // Initial height for clipboard-only
    recalcHeight();
  </script>
</body>
</html>
