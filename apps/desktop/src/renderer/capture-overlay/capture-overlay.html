<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privanote Capture</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      min-width: 48px;
      height: 72px;
      transition: height 200ms ease-out, width 200ms ease-out;
    }
    .container {
      min-width: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      -webkit-app-region: drag;
      transition: height 200ms ease-out;
      position: relative;
    }
    .btn {
      -webkit-app-region: no-drag;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 150ms ease, transform 150ms ease;
      position: relative;
      z-index: 1;
      background: oklch(0.214 0.009 43.1);
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.24);
    }
    .btn:hover { background: oklch(0.35 0.012 43.1); transform: scale(1.06); }
    .btn.recording { background: oklch(0.65 0.15 195); box-shadow: 0 1px 8px oklch(0.65 0.15 195 / 0.35); }
    .btn.finalizing { background: oklch(0.547 0.021 43.1); cursor: default; }
    .btn svg {
      width: 18px; height: 18px;
      fill: none;
      stroke: oklch(0.986 0.002 67.8);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .btn.recording svg { width: 15px; height: 15px; stroke: white; }
    .btn.finalizing svg { stroke: white; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; }
    .btn.monitoring { background: oklch(0.65 0.15 195); box-shadow: 0 1px 8px oklch(0.65 0.15 195 / 0.35); }
    .btn.monitoring svg { width: 15px; height: 15px; stroke: white; }
    .btn.clip-finalizing { background: oklch(0.547 0.021 43.1); cursor: default; }
    .btn.clip-finalizing svg { stroke: white; }
    .badge {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: oklch(0.65 0.15 195);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 9px;
      font-weight: 600;
      line-height: 16px;
      text-align: center;
      display: none;
      z-index: 2;
      pointer-events: none;
    }

    /* Call recording button states */
    .btn.call-recording { background: oklch(0.65 0.15 195); box-shadow: 0 1px 8px oklch(0.65 0.15 195 / 0.35); }
    .btn.call-recording svg { width: 15px; height: 15px; stroke: white; }
    .btn.call-amber { background: oklch(0.75 0.18 85); box-shadow: 0 1px 8px oklch(0.75 0.18 85 / 0.35); }
    .btn.call-amber svg { width: 15px; height: 15px; stroke: white; }
    .btn.call-finalizing { background: oklch(0.547 0.021 43.1); cursor: default; }
    .btn.call-finalizing svg { stroke: white; }

    /* Mutual exclusion disabled state */
    .btn.disabled { opacity: 0.35; pointer-events: none; cursor: default; }

    /* Conditional visibility for screen capture and call buttons */
    #btn { display: none; }
    #btn.visible { display: flex; }
    #callBtn { display: none; }
    #callBtn.visible { display: flex; }

    /* Call mode picker */
    .mode-picker { display: none; flex-direction: column; gap: 6px; align-items: center; }
    .mode-picker.visible { display: flex; }
    .mode-btn {
      -webkit-app-region: no-drag;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: oklch(0.65 0.15 195);
      box-shadow: 0 1px 6px oklch(0.65 0.15 195 / 0.3);
      transition: transform 150ms ease, background-color 150ms ease;
    }
    .mode-btn:hover { transform: scale(1.08); background: oklch(0.70 0.15 195); }
    .mode-btn svg {
      width: 15px; height: 15px;
      fill: none;
      stroke: white;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* PR analysis button states */
    #prBtn { display: none; }
    #prBtn.visible { display: flex; }
    .btn.pr-analyzing { background: oklch(0.65 0.15 195); box-shadow: 0 1px 8px oklch(0.65 0.15 195 / 0.35); }
    .btn.pr-analyzing svg { width: 15px; height: 15px; stroke: white; }
    .btn.pr-finalizing { background: oklch(0.547 0.021 43.1); cursor: default; }
    .btn.pr-finalizing svg { stroke: white; }

    /* URL input popover */
    .pr-popover {
      display: none;
      position: absolute;
      right: 56px;
      width: 280px;
      background: oklch(0.214 0.009 43.1);
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.32);
      padding: 8px;
      z-index: 10;
    }
    .pr-popover.visible { display: block; }

    .pr-popover input {
      width: 100%;
      height: 32px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      font-weight: 400;
      background: oklch(0.30 0.008 43.1);
      border: 1px solid oklch(0.40 0.01 43.1);
      border-radius: 6px;
      padding: 0 8px;
      color: oklch(0.95 0 0);
      outline: none;
      box-sizing: border-box;
    }
    .pr-popover input::placeholder { color: oklch(0.55 0.01 43.1); }
    .pr-popover input:focus { border-color: oklch(0.65 0.15 195); box-shadow: 0 0 0 2px oklch(0.65 0.15 195 / 0.3); }

    .pr-validation {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      font-weight: 400;
      color: oklch(0.75 0.18 25);
      margin-top: 4px;
      display: none;
    }
    .pr-validation.visible { display: block; }

    .pr-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    .pr-dismiss {
      -webkit-app-region: no-drag;
      padding: 4px 12px;
      height: 28px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      font-weight: 400;
      background: transparent;
      color: oklch(0.70 0.01 43.1);
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .pr-dismiss:hover { background: oklch(0.30 0.008 43.1); }

    .pr-submit {
      -webkit-app-region: no-drag;
      padding: 4px 12px;
      height: 28px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      font-weight: 600;
      background: oklch(0.65 0.15 195);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .pr-submit:hover { background: oklch(0.70 0.15 195); }
    .pr-submit:disabled { opacity: 0.5; pointer-events: none; }

    /* Status text below PR button */
    .pr-status {
      display: none;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-align: center;
      color: oklch(0.65 0.15 195);
      width: 48px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 4px 0;
    }
    .pr-status.visible { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <button class="btn" id="clipBtn" title="Start clipboard monitoring" aria-label="Start clipboard monitoring">
      <span class="badge" id="badge" aria-live="polite"></span>
      <svg id="clipIcon" viewBox="0 0 24 24">
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
      </svg>
    </button>
    <button class="btn" id="btn" title="Start screen capture" aria-label="Start screen capture">
      <svg id="icon" viewBox="0 0 24 24">
        <!-- eye-closed icon (idle) -->
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
        <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
    </button>
    <button class="btn" id="callBtn" title="Record call" aria-label="Record call">
      <svg id="callIcon" viewBox="0 0 24 24">
        <!-- headphones-off icon (idle) -->
        <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
    </button>
    <div class="mode-picker" id="modePicker">
      <button class="mode-btn" id="modeAudio" title="Audio only" aria-label="Audio only">
        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <button class="mode-btn" id="modeVideo" title="Audio + Video" aria-label="Audio + Video">
        <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      </button>
    </div>
    <button class="btn" id="prBtn" title="Analyze this PR" aria-label="Analyze this PR">
      <svg id="prIcon" viewBox="0 0 24 24">
        <circle cx="18" cy="18" r="3"/>
        <circle cx="6" cy="6" r="3"/>
        <path d="M6 9v12"/>
        <path d="M18 9a9 9 0 0 0-9 9"/>
        <line x1="2" y1="2" x2="22" y2="22"/>
      </svg>
      <div class="pr-popover" id="prPopover">
        <input type="text" id="prUrlInput" placeholder="github.com/owner/repo/pull/123" />
        <div class="pr-validation" id="prValidation">Enter a valid GitHub PR URL</div>
        <div class="pr-actions">
          <button class="pr-dismiss" id="prDismiss">Dismiss</button>
          <button class="pr-submit" id="prSubmit">Analyze PR</button>
        </div>
      </div>
    </button>
    <div class="pr-status" id="prStatus"></div>
  </div>

  <script>
    const btn = document.getElementById('btn');
    const icon = document.getElementById('icon');
    const container = document.querySelector('.container');

    // Track which buttons are visible to compute dynamic height
    let captureVisible = false;
    let callVisible = false;

    // Mutual exclusion state tracking
    let screenCaptureActive = false;
    let callRecActive = false;

    let prVisible = false;
    let prPopoverVisible = false;

    function recalcHeight() {
      // clipboard always visible = 1, plus conditional buttons
      let count = 1;
      if (captureVisible) count++;
      if (callVisible) count++;
      if (prVisible) count++;
      let height = count * 44 + 4; // 40px button + 4px gap per button, plus 4px padding
      // Mode picker adds 2 small buttons (34px each + 6px gap + 4px spacing)
      if (modePickerVisible) height += 78;
      if (prStatus.classList.contains('visible')) height += 16;
      document.body.style.height = height + 'px';
      container.style.height = height + 'px';
      // Notify main process to resize the window
      if (window.captureApi && window.captureApi.resizeOverlay) {
        const width = prPopoverVisible ? 336 : 48;
        window.captureApi.resizeOverlay(width, height);
      }
    }

    function updateMutualExclusion() {
      // Disable screen capture button when call recording is active
      if (callRecActive && !screenCaptureActive) {
        btn.classList.add('disabled');
      } else {
        btn.classList.remove('disabled');
      }
      // Disable call button when screen capture is active
      if (screenCaptureActive && !callRecActive && callBtn.classList.contains('visible')) {
        callBtn.classList.add('disabled');
      } else {
        callBtn.classList.remove('disabled');
      }
    }

    // --- Screen capture button ---
    const ICONS = {
      idle: `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`,
      recording: `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`,
      finalizing: `<path class="spinner" d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>`,
    };

    const TITLES = {
      idle: 'Start screen capture',
      recording: 'Stop screen capture',
      finalizing: 'Creating note...',
    };

    function setState(raw) {
      // CaptureSession emits 'capturing', overlay uses 'recording'
      const state = raw === 'capturing' ? 'recording' : raw;
      // Preserve 'visible' class
      const vis = btn.classList.contains('visible') ? ' visible' : '';
      btn.className = 'btn' + (state !== 'idle' ? ' ' + state : '') + vis;
      icon.innerHTML = ICONS[state] || ICONS.idle;
      btn.title = TITLES[state] || TITLES.idle;
      btn.setAttribute('aria-label', btn.title);
      screenCaptureActive = (state === 'recording' || state === 'finalizing');
      updateMutualExclusion();
    }

    function showCaptureButton() {
      if (!captureVisible) {
        captureVisible = true;
        btn.classList.add('visible');
        recalcHeight();
      }
    }

    function hideCaptureButton() {
      // Don't hide if actively capturing
      if (screenCaptureActive) return;
      if (captureVisible) {
        captureVisible = false;
        btn.classList.remove('visible');
        recalcHeight();
      }
    }

    // Listen for state changes from main process
    if (window.captureApi) {
      window.captureApi.getSessionState().then(s => { if (s) setState(s); });
      window.captureApi.onStateChange(setState);
    }

    btn.addEventListener('click', async () => {
      if (!window.captureApi) {
        console.warn('[capture-overlay] captureApi not available');
        return;
      }
      if (btn.classList.contains('finalizing')) return;

      if (btn.classList.contains('recording')) {
        await window.captureApi.stopSession();
      } else {
        await window.captureApi.startSession();
      }
    });

    // --- Clipboard button (always visible) ---
    const clipBtn = document.getElementById('clipBtn');
    const clipIcon = document.getElementById('clipIcon');
    const badge = document.getElementById('badge');

    const CLIP_ICONS = {
      idle: `<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>`,
      monitoring: `<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="13" y2="14"/>`,
      finalizing: `<path class="spinner" d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>`,
    };

    const CLIP_TITLES = {
      idle: 'Start clipboard monitoring',
      monitoring: 'Stop clipboard monitoring',
      finalizing: 'Creating note...',
    };

    function setClipState(state) {
      const cssClass = state === 'monitoring' ? 'monitoring' : (state === 'finalizing' ? 'clip-finalizing' : '');
      clipBtn.className = 'btn' + (cssClass ? ' ' + cssClass : '');
      clipIcon.innerHTML = CLIP_ICONS[state] || CLIP_ICONS.idle;
      clipBtn.title = CLIP_TITLES[state] || CLIP_TITLES.idle;
      clipBtn.setAttribute('aria-label', clipBtn.title);
      if (state === 'idle') {
        badge.style.display = 'none';
        badge.textContent = '';
      }
    }

    function updateBadge(count) {
      if (count > 0) {
        badge.style.display = 'block';
        badge.textContent = count > 99 ? '99+' : String(count);
      } else {
        badge.style.display = 'none';
        badge.textContent = '';
      }
    }

    if (window.captureApi) {
      window.captureApi.getClipboardState().then(s => { if (s) setClipState(s); });
      window.captureApi.onClipboardStateChange(setClipState);
      window.captureApi.onClipboardCount(updateBadge);
    }

    clipBtn.addEventListener('click', async () => {
      if (!window.captureApi) {
        console.warn('[capture-overlay] captureApi not available');
        return;
      }
      if (clipBtn.classList.contains('clip-finalizing')) return;

      if (clipBtn.classList.contains('monitoring')) {
        await window.captureApi.stopClipboard();
      } else {
        await window.captureApi.startClipboard();
      }
    });

    // --- Call recording button ---
    const callBtn = document.getElementById('callBtn');
    const callIcon = document.getElementById('callIcon');
    let callMediaActive = false;
    let callRecState = 'idle'; // idle, recording, amber, finalizing

    const CALL_ICONS = {
      idle: `<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/><line x1="1" y1="1" x2="23" y2="23"/>`,
      recording: `<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>`,
      finalizing: `<path class="spinner" d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>`,
    };

    function setCallState(state, appName) {
      callRecState = state;
      callRecActive = (state === 'recording' || state === 'amber' || state === 'finalizing');
      const label = appName || 'call';
      // Preserve 'visible' class
      const vis = callBtn.classList.contains('visible') ? ' visible' : '';
      if (state === 'idle') {
        callBtn.className = 'btn' + vis;
        callIcon.innerHTML = CALL_ICONS.idle;
        callBtn.title = `Record ${label}`;
        callBtn.setAttribute('aria-label', `Record ${label}`);
      } else if (state === 'recording') {
        callBtn.className = 'btn call-recording' + vis;
        callIcon.innerHTML = CALL_ICONS.recording;
        callBtn.title = `Stop ${label} recording`;
        callBtn.setAttribute('aria-label', `Stop ${label} recording`);
      } else if (state === 'amber') {
        callBtn.className = 'btn call-amber' + vis;
        callIcon.innerHTML = CALL_ICONS.recording;
        callBtn.title = 'Stop recording (call ended)';
        callBtn.setAttribute('aria-label', 'Stop recording (call ended)');
      } else if (state === 'finalizing') {
        callBtn.className = 'btn call-finalizing' + vis;
        callIcon.innerHTML = CALL_ICONS.finalizing;
        callBtn.title = 'Creating note...';
        callBtn.setAttribute('aria-label', 'Creating note...');
      }
      updateMutualExclusion();
    }

    let currentAppName = '';

    function showCallButton(appName) {
      callMediaActive = true;
      currentAppName = appName || 'Unknown';
      const displayName = currentAppName + ' call';
      if (!callVisible) {
        callVisible = true;
        callBtn.classList.add('visible');
        recalcHeight();
      }
      if (callRecState === 'idle') {
        setCallState('idle', displayName);
      }
    }

    function hideCallButton() {
      callMediaActive = false;
      if (callRecState === 'idle') {
        callVisible = false;
        callBtn.classList.remove('visible');
        callBtn.className = 'btn';
        recalcHeight();
      }
      // If recording, button stays visible (amber state handled by onCallEnded)
    }

    function removeCallButton() {
      callVisible = false;
      callBtn.classList.remove('visible');
      callBtn.className = 'btn';
      callRecState = 'idle';
      recalcHeight();
    }

    if (window.captureApi) {
      // Check initial state on load
      window.captureApi.getMediaState().then(state => {
        if (state && state.active) {
          showCallButton(state.appName);
          if (state.callRecordingActive) {
            setCallState('recording', (state.appName || 'Unknown') + ' call');
          }
        }
      });

      window.captureApi.onMediaDetected((data) => {
        showCallButton(data.appName);
      });

      window.captureApi.onMediaEnded(() => {
        hideCallButton();
      });

      window.captureApi.onCallEnded(() => {
        // Call ended while recording — transition to amber per D-07
        if (callRecState === 'recording') {
          setCallState('amber');
        } else {
          hideCallButton();
        }
      });

      window.captureApi.onCallRecordingState((state) => {
        if (state === 'recording') {
          setCallState('recording', currentAppName + ' call');
        } else if (state === 'finalizing') {
          setCallState('finalizing');
        } else if (state === 'idle') {
          // Recording finished
          if (!callMediaActive) {
            removeCallButton();
          } else {
            setCallState('idle', currentAppName + ' call');
          }
        }
      });

      // Listen for whitelist state changes from main process
      window.captureApi.onWhitelistState((whitelisted) => {
        if (whitelisted) {
          showCaptureButton();
        } else {
          hideCaptureButton();
        }
      });
    }

    // --- Mode picker ---
    const modePicker = document.getElementById('modePicker');
    let modePickerVisible = false;

    function showModePicker() {
      modePickerVisible = true;
      modePicker.classList.add('visible');
      recalcHeight();
    }

    function hideModePicker() {
      modePickerVisible = false;
      modePicker.classList.remove('visible');
      recalcHeight();
    }

    callBtn.addEventListener('click', async () => {
      if (!window.captureApi) return;
      if (callRecState === 'finalizing') return;

      if (callRecState === 'recording' || callRecState === 'amber') {
        await window.captureApi.stopCallRecording();
      } else {
        // Show mode picker instead of starting immediately
        if (modePickerVisible) {
          hideModePicker();
        } else {
          showModePicker();
        }
      }
    });

    document.getElementById('modeAudio').addEventListener('click', async () => {
      hideModePicker();
      await window.captureApi.startCallRecording('audio');
    });

    document.getElementById('modeVideo').addEventListener('click', async () => {
      hideModePicker();
      await window.captureApi.startCallRecording('video');
    });

    // --- PR analysis button ---
    const prBtn = document.getElementById('prBtn');
    const prIcon = document.getElementById('prIcon');
    const prPopover = document.getElementById('prPopover');
    const prUrlInput = document.getElementById('prUrlInput');
    const prValidation = document.getElementById('prValidation');
    const prSubmit = document.getElementById('prSubmit');
    const prDismiss = document.getElementById('prDismiss');
    const prStatus = document.getElementById('prStatus');
    let prState = 'idle'; // idle, analyzing, finalizing
    let detectedPrUrl = '';

    const PR_ICONS = {
      idle: '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 9v12"/><path d="M18 9a9 9 0 0 0-9 9"/><line x1="2" y1="2" x2="22" y2="22"/>',
      analyzing: '<path class="spinner" d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>',
      finalizing: '<path class="spinner" d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>',
    };

    const PR_STATUS_TEXT = {
      pending: 'Analyzing...',
      analyzing: 'Analyzing...',
      fetching_reviews: 'Fetching reviews...',
      generating_note: 'Generating note...',
    };

    const PR_URL_RE = /github\.com\/([^/]+)\/([^/]+)\/pull\/(\d+)/;

    function showPrButton() {
      if (!prVisible) {
        prVisible = true;
        prBtn.classList.add('visible');
        recalcHeight();
      }
    }

    function hidePrButton() {
      if (prState !== 'idle') return; // don't hide during analysis
      if (prVisible) {
        prVisible = false;
        prBtn.classList.remove('visible');
        hidePrPopover();
        hidePrStatus();
        recalcHeight();
      }
    }

    function setPrState(state) {
      prState = state;
      const vis = prBtn.classList.contains('visible') ? ' visible' : '';
      if (state === 'idle') {
        prBtn.className = 'btn' + vis;
        prIcon.innerHTML = PR_ICONS.idle;
        prBtn.title = 'Analyze this PR';
        prBtn.setAttribute('aria-label', 'Analyze this PR');
      } else if (state === 'analyzing') {
        prBtn.className = 'btn pr-analyzing' + vis;
        prIcon.innerHTML = PR_ICONS.analyzing;
        prBtn.title = 'Analyzing PR...';
        prBtn.setAttribute('aria-label', 'Analyzing PR...');
      } else if (state === 'finalizing') {
        prBtn.className = 'btn pr-finalizing' + vis;
        prIcon.innerHTML = PR_ICONS.finalizing;
        prBtn.title = 'Creating note...';
        prBtn.setAttribute('aria-label', 'Creating note...');
      }
    }

    function showPrPopover() {
      prPopoverVisible = true;
      prPopover.classList.add('visible');
      prUrlInput.value = detectedPrUrl;
      validatePrUrl();
      prUrlInput.focus();
      recalcHeight();
    }

    function hidePrPopover() {
      prPopoverVisible = false;
      prPopover.classList.remove('visible');
      prValidation.classList.remove('visible');
      recalcHeight();
    }

    function showPrStatus(text) {
      prStatus.textContent = text;
      prStatus.classList.add('visible');
      recalcHeight();
    }

    function hidePrStatus() {
      prStatus.classList.remove('visible');
      prStatus.textContent = '';
      recalcHeight();
    }

    function validatePrUrl() {
      const valid = PR_URL_RE.test(prUrlInput.value.trim());
      if (!valid && prUrlInput.value.trim().length > 0) {
        prValidation.classList.add('visible');
      } else {
        prValidation.classList.remove('visible');
      }
      prSubmit.disabled = !valid;
      return valid;
    }

    prUrlInput.addEventListener('input', validatePrUrl);
    prUrlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && validatePrUrl()) {
        startPrAnalysis();
      } else if (e.key === 'Escape') {
        hidePrPopover();
      }
    });

    // Prevent click on popover from bubbling to button
    prPopover.addEventListener('click', (e) => e.stopPropagation());

    prBtn.addEventListener('click', () => {
      if (prState === 'analyzing' || prState === 'finalizing') return;
      if (prPopoverVisible) {
        hidePrPopover();
      } else {
        showPrPopover();
      }
    });

    prDismiss.addEventListener('click', (e) => {
      e.stopPropagation();
      hidePrPopover();
    });

    prSubmit.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!validatePrUrl()) return;
      await startPrAnalysis();
    });

    async function startPrAnalysis() {
      if (!window.captureApi) return;
      const url = prUrlInput.value.trim();
      hidePrPopover();
      setPrState('analyzing');
      showPrStatus('Analyzing...');

      const result = await window.captureApi.startPrAnalysis(url);
      if (!result.success) {
        setPrState('idle');
        hidePrStatus();
      }
    }

    // Close popover on outside click
    document.addEventListener('click', (e) => {
      if (prPopoverVisible && !prBtn.contains(e.target)) {
        hidePrPopover();
      }
    });

    if (window.captureApi) {
      // Check if feature is enabled
      window.captureApi.isPrAnalysisEnabled().then(enabled => {
        if (!enabled) return;

        window.captureApi.onPrUrlDetected((data) => {
          detectedPrUrl = data.url;
          showPrButton();
        });

        window.captureApi.onPrUrlCleared(() => {
          detectedPrUrl = '';
          hidePrButton();
        });

        window.captureApi.onPrStatusUpdate((data) => {
          const text = PR_STATUS_TEXT[data.status] || 'Analyzing...';
          showPrStatus(text);
          if (data.status === 'generating_note') {
            setPrState('finalizing');
          }
        });

        window.captureApi.onPrAnalysisComplete(() => {
          setPrState('idle');
          hidePrStatus();
        });

        window.captureApi.onPrAnalysisError((data) => {
          setPrState('idle');
          hidePrStatus();
        });
      });
    }

    // Initial height for clipboard-only
    recalcHeight();
  </script>
</body>
</html>
